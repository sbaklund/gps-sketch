services:
  - type: web
    name: gps-sketch
    runtime: node
    region: oregon

    buildCommand: npm install

    startCommand: node server.js

    plan: free
    autoDeploy: true

    envVars:
      # MapTiler API key — set the actual value in the Render dashboard.
      - key: MAPTILER_KEY
        sync: false

      # Strava OAuth — set these in the Render dashboard, never commit secrets.
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false

      # Optional — paste your refresh token here so Strava survives redeploys.
      - key: STRAVA_REFRESH_TOKEN
        sync: false

      # NOT NEEDED in single-service mode (frontend + backend = same origin).
      # Only set FRONTEND_URL if you're running the frontend separately during dev.
      # - key: FRONTEND_URL
      #   value: http://localhost:5500

      # NOT NEEDED — same-origin means no CORS issues. Only set for dev.
      # - key: ALLOWED_ORIGINS
      #   value: http://localhost:5500
